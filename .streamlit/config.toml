# Theme of the frontend (frontend/app.py): light and neutral, one dark blue accent.
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#1C2430"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
